<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Sanborn Fire Insurance Map Sheet">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#b89f72" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="26" rx="4" fill="#233142"/>
  <text x="34" y="39" fill="#f8ecc9" font-family="Georgia, serif" font-size="11.5" font-weight="bold">SANBORN FIRE INSURANCE MAP - HOUSTON, TEX. (VOL. 2, SHEET 214)</text>
  <text x="386" y="39" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="end">SCALE 50 FT=1 IN</text>
  <!-- Street corridor -->
  <rect x="24" y="176" width="372" height="34" fill="#e5dcc5" stroke="#948260" stroke-width="1"/>
  <line x1="24" y1="193" x2="396" y2="193" stroke="#7c6a4a" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="210" y="197" fill="#3b3123" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">HEIGHTS BLVD. (6in WATER PIPE)  |  1435 (OLD 435)</text>
  <!-- Lot lines -->
  <rect x="34" y="56" width="166" height="120" fill="none" stroke="#8b795e" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="200" y="56" width="184" height="120" fill="none" stroke="#8b795e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="42" y="70" fill="#5c4d36" font-family="monospace" font-size="9">LOT 14 - BLK 62</text>
  <text x="208" y="70" fill="#5c4d36" font-family="monospace" font-size="9">LOT 15 - BLK 62</text>
  <!-- Yellow wood frame dwelling (#b1) + dashed porch + #b2 garage apt -->
  <rect x="58" y="88" width="88" height="54" fill="#facc15" fill-opacity="0.78" stroke="#854d0e" stroke-width="1.8"/>
  <rect x="58" y="142" width="88" height="16" fill="#fef08a" fill-opacity="0.6" stroke="#854d0e" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="102" y="117" fill="#422006" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle">D (Frame)</text>
  <text x="65" y="102" fill="#713f12" font-family="monospace" font-size="10" font-weight="bold">2</text>
  <text x="136" y="137" fill="#713f12" font-family="monospace" font-size="9">Comp. Rf</text>
  <text x="102" y="153" fill="#713f12" font-family="monospace" font-size="8.5" text-anchor="middle">1-Story Open Porch</text>
  <!-- Secondary rear carriage house #b2 -->
  <rect x="154" y="62" width="38" height="28" fill="#facc15" fill-opacity="0.72" stroke="#854d0e" stroke-width="1.4"/>
  <text x="173" y="79" fill="#422006" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Auto / 2</text>
  <!-- Pink brick commercial structure on Lot 15 -->
  <rect x="224" y="78" width="134" height="84" fill="#f472b6" fill-opacity="0.58" stroke="#9d174d" stroke-width="2.2"/>
  <text x="291" y="116" fill="#831843" font-family="Georgia, serif" font-size="12.5" font-weight="bold" text-anchor="middle">S (Brick Store)</text>
  <text x="232" y="93" fill="#831843" font-family="monospace" font-size="10" font-weight="bold">2B</text>
  <text x="291" y="134" fill="#831843" font-family="monospace" font-size="9" text-anchor="middle">12in Fire Wall | Skylight</text>
  <!-- Legend Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <circle cx="38" cy="227" r="5" fill="#facc15"/>
  <text x="48" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="9.5">Yellow = Wood Frame</text>
  <circle cx="164" cy="227" r="5" fill="#f472b6"/>
  <text x="174" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="9.5">Pink = Brick</text>
  <text x="252" y="230" fill="#93c5fd" font-family="sans-serif" font-size="9.5">1911 Dual Address + Footprint Proof</text>
</svg>
