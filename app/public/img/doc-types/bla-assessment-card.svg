<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Harris County Archives CR001 Building and Land Assessment Card">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="#f9efd8" stroke="#c28e5c" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#7c2d12"/>
  <text x="32" y="38" fill="#ffedd5" font-family="monospace" font-size="11" font-weight="bold">HARRIS COUNTY TAX ASSESSOR - BUILDING &amp; LAND CARD (RG CR001)</text>
  <!-- Left form table -->
  <rect x="24" y="52" width="204" height="158" fill="#fffaf0" stroke="#c2410c" stroke-width="1"/>
  <line x1="24" y1="76" x2="228" y2="76" stroke="#ea580c" stroke-width="0.8"/>
  <line x1="24" y1="100" x2="228" y2="100" stroke="#ea580c" stroke-width="0.8"/>
  <line x1="24" y1="124" x2="228" y2="124" stroke="#ea580c" stroke-width="0.8"/>
  <line x1="24" y1="148" x2="228" y2="148" stroke="#ea580c" stroke-width="0.8"/>
  <line x1="24" y1="176" x2="228" y2="176" stroke="#ea580c" stroke-width="0.8"/>
  <text x="30" y="68" fill="#7c2d12" font-family="monospace" font-size="9.5" font-weight="bold">ADDITION: HOUSTON HEIGHTS BLK 62 LOT 14</text>
  <text x="30" y="92" fill="#1e293b" font-family="monospace" font-size="10">YEAR ERECTED: <tspan fill="#b91c1c" font-weight="bold">1914</tspan> (Pre-1984 Roll)</text>
  <text x="30" y="116" fill="#1e293b" font-family="monospace" font-size="10">PERMIT NO: <tspan font-weight="bold">#18412 (04/1914)</tspan></text>
  <text x="30" y="140" fill="#1e293b" font-family="monospace" font-size="10">BUILDER: <tspan font-weight="bold">W. B. Jones &amp; Sons</tspan></text>
  <text x="30" y="164" fill="#1e293b" font-family="monospace" font-size="9.5">FOUNDATION: <tspan fill="#15803d" font-weight="bold">[X] Pier &amp; Beam</tspan>  [ ] Slab</text>
  <text x="30" y="196" fill="#1e293b" font-family="monospace" font-size="9.5">EXT WALLS: Wood Siding | ROOF: Gable</text>
  <!-- Right red-ruled footprint sketch -->
  <rect x="236" y="52" width="160" height="158" fill="#fffdf9" stroke="#dc2626" stroke-width="1"/>
  <line x1="236" y1="84" x2="396" y2="84" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="236" y1="116" x2="396" y2="116" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="236" y1="148" x2="396" y2="148" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="236" y1="180" x2="396" y2="180" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="268" y1="52" x2="268" y2="210" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="300" y1="52" x2="300" y2="210" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="332" y1="52" x2="332" y2="210" stroke="#fca5a5" stroke-width="0.6"/>
  <line x1="364" y1="52" x2="364" y2="210" stroke="#fca5a5" stroke-width="0.6"/>
  <text x="316" y="66" fill="#991b1b" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">MEASURED PERIMETER SKETCH</text>
  <rect x="264" y="82" width="104" height="72" fill="#fee2e2" fill-opacity="0.65" stroke="#b91c1c" stroke-width="1.8"/>
  <rect x="278" y="154" width="76" height="22" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="316" y="118" fill="#7f1d1d" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1,232 SQ FT</text>
  <text x="316" y="132" fill="#7f1d1d" font-family="monospace" font-size="8.5" text-anchor="middle">28 FT x 44 FT</text>
  <text x="316" y="168" fill="#991b1b" font-family="monospace" font-size="8" text-anchor="middle">Porch 8 x 20</text>
  <!-- Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#fde68a" font-family="sans-serif" font-size="9.5" text-anchor="middle">915 Boxes at Harris County Archives | Overturns 1920/1930 HCAD Rounding</text>
</svg>
