<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Texas DSHS 10-Day Asbestos Demolition Notification Form">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#dc2626" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#991b1b"/>
  <text x="34" y="38" fill="#fef2f2" font-family="monospace" font-size="10.5" font-weight="bold">TEXAS DSHS - 10-WORKING-DAY ASBESTOS / DEMOLITION NOTIFICATION</text>
  <rect x="24" y="54" width="372" height="154" rx="4" fill="#fffdf9" stroke="#f87171" stroke-width="1.2"/>
  <rect x="34" y="62" width="212" height="22" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="42" y="77" fill="#991b1b" font-family="monospace" font-size="9.5" font-weight="bold">STATUTORY 10-DAY ADVANCE NOTICE</text>
  <rect x="254" y="62" width="132" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="320" y="77" fill="#92400e" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">TYPE: DEMOLITION</text>
  <text x="34" y="102" fill="#1e293b" font-family="monospace" font-size="9.5">FACILITY: <tspan font-weight="bold">Historic Commercial / Warehouse Bldg (Built 1923)</tspan></text>
  <text x="34" y="120" fill="#1e293b" font-family="monospace" font-size="9.5">SCHEDULED ABATEMENT / DEMO START: <tspan fill="#b91c1c" font-weight="bold">+10 Working Days Out</tspan></text>
  <text x="34" y="138" fill="#1e293b" font-family="monospace" font-size="9.5">OPERATOR / OWNER: <tspan font-weight="bold">Unmasked Redevelopment LLC</tspan></text>
  <text x="34" y="156" fill="#0f766e" font-family="monospace" font-size="9.5">TCEQ CROSS-CHECK: Brownfields / Dry Cleaner / LPST Site Registry</text>
  <rect x="34" y="168" width="352" height="30" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="210" y="187" fill="#991b1b" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Fires 2 Weeks Before Municipal Structural Demolition Permits Are Issued</text>
  <!-- Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#fca5a5" font-family="sans-serif" font-size="9.5" text-anchor="middle">Mandatory State Pre-Demolition Asbestos Filings + TCEQ Remediation Registries</text>
</svg>
