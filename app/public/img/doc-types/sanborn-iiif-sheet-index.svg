        <rect x="24" y="74" width="262" height="150" rx="6" fill="#f5efe6" stroke="#fb7185" stroke-width="1.4"/>
        <text x="34" y="90" fill="#881337" font-family="serif" font-size="10.5" font-weight="700">SANBORN VOL. 6 // SHEET 614 (1924)</text>
