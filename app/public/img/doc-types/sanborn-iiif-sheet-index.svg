        <rect x="42" y="178" width="230" height="36" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
        <text x="52" y="199" fill="#881337" font-family="monospace" font-size="9" font-weight="700">PINK = BRICK COMMERCIAL STOREFRONT (12" WALL)</text>

        <rect x="294" y="74" width="262" height="150" rx="6" fill="#332330" stroke="#54384f" stroke-width="1.2"/>
        <text x="304" y="92" fill="#f43f5e" font-family="sans-serif" font-size="10.5" font-weight="700">Sanborn Fire Atlas Color Key</text>
        <rect x="304" y="102" width="242" height="22" rx="3" fill="#21171f"/>
        <text x="310" y="116" fill="#fde047" font-family="monospace" font-size="9">D (Dwelling) - 1.5 Story | Yellow = Wood Fra</text>
        <rect x="304" y="128" width="242" height="22" rx="3" fill="#21171f"/>
        <text x="310" y="142" fill="#fda4af" font-family="monospace" font-size="9">Brick Comm. Storefront | Pink = Brick | Fire</text>
        <text x="304" y="172" fill="#fdf2f8" font-family="sans-serif" font-size="9">• Yellow = Wood Frame | Pink = Brick | Blue = Stone/Concrete</text><text x="304" y="189" fill="#fdf2f8" font-family="sans-serif" font-size="9">• &#x27;D&#x27; = Dwelling | &#x27;A&#x27; = Auto Garage | &#x27;1 1/2&#x27; = Stories</text><text x="304" y="206" fill="#fdf2f8" font-family="sans-serif" font-size="9">• Proves pre-1924 footprint survival vs. modern replacement</text>
        

  <!-- Bottom Provenance Footer -->
  <rect x="24" y="230" width="532" height="20" rx="4" fill="#332330"/>
