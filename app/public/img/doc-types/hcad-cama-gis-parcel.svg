  <text x="92" y="157" fill="#0f172a" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Built 1914</text>
  <text x="92" y="171" fill="#1e293b" font-family="monospace" font-size="8" text-anchor="middle">2,410 SF | 26ft Roof</text>
  <!-- #b2 Secondary Garage Apt -->
  <rect x="144" y="88" width="42" height="38" rx="2" fill="#10b981" fill-opacity="0.82" stroke="#a7f3d0" stroke-width="1.4"/>
  <text x="165" y="105" fill="#064e3b" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">#b2 Rear</text>
  <text x="165" y="118" fill="#064e3b" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">1924 Apt</text>
  <!-- Right 6-Tier Ownership & LLC Unmasking Graph -->
  <rect x="214" y="54" width="182" height="154" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <text x="305" y="70" fill="#fde047" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">6-TIER OWNERSHIP UNMASKING</text>
  <rect x="224" y="78" width="162" height="28" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <text x="305" y="95" fill="#f8fafc" font-family="monospace" font-size="8.5" text-anchor="middle">HCAD: "1435 HEIGHTS HOLDINGS LLC"</text>
  <line x1="305" y1="106" x2="305" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="224" y="120" width="162" height="32" rx="3" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
  <text x="305" y="134" fill="#93c5fd" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">TX SOS / Comptroller PIR Join</text>
  <text x="305" y="146" fill="#dbeafe" font-family="sans-serif" font-size="8" text-anchor="middle">Shared Tax Mailing Address + Agent</text>
  <line x1="305" y1="152" x2="305" y2="166" stroke="#10b981" stroke-width="1.5"/>
  <rect x="224" y="166" width="162" height="32" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="305" y="180" fill="#a7f3d0" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Managing Member + 14 Linked Lots</text>
  <text x="305" y="192" fill="#ecfdf5" font-family="sans-serif" font-size="8" text-anchor="middle">+ 22-Yr Certified Roll History</text>
