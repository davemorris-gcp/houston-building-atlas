  <!-- Left GIS Parcel with #b1 and #b2 -->
  <rect x="24" y="54" width="182" height="154" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="32" y="70" fill="#bae6fd" font-family="monospace" font-size="9" font-weight="bold">PARCEL 0201520000004 (3D LiDAR)</text>
  <polygon points="36,80 194,80 194,196 36,196" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- #b1 Primary Building -->
  <rect x="48" y="114" width="88" height="66" rx="2" fill="#f59e0b" fill-opacity="0.82" stroke="#fef08a" stroke-width="1.6"/>
