  <rect x="24" y="216" width="372" height="22" rx="4" fill="#0f172a"/>
  <text x="210" y="230" fill="#7dd3fc" font-family="sans-serif" font-size="9.5" text-anchor="middle">1.54M Parcels &amp; 1.50M Dated Footprints across 5 PMTiles Shards + 22 Annual Rolls</text>
