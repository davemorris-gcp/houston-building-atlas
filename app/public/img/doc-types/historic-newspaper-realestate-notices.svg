<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="100%" height="100%">
  <rect x="2" y="2" width="576" height="256" rx="12" fill="#1c1917" stroke="#f59e0b" stroke-width="1.8"/>
  <!-- Top Document Header Bar -->
  <rect x="16" y="14" width="548" height="50" rx="7" fill="#292524" stroke="#44403c" stroke-width="1.2"/>
  <text x="28" y="34" fill="#f59e0b" font-family="monospace" font-size="10.8" font-weight="700">THE HOUSTON DAILY POST // SUNDAY REAL ESTATE &amp; BUILDING SECTION</text>
  <text x="28" y="52" fill="#d6d3d1" font-family="monospace" font-size="9.2">October 18, 1914 | Page 42, Column 3 | &#x27;New Homes Under Way in Houston Heights&#x27;</text>
  <!-- Stamp Badge -->
  <rect x="424" y="20" width="130" height="22" rx="4" fill="#1c1917" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="432" y="35" fill="#f59e0b" font-family="monospace" font-size="8.8" font-weight="700">1880-1965 NEWS CLIPS</text>

  <!-- Document Body -->
  
        <rect x="24" y="74" width="532" height="150" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1.3"/>
        <text x="42" y="98" fill="#f59e0b" font-family="serif" font-size="12.5" font-weight="700">J. H. MILLER LETS CONTRACT FOR HANDSOME HEIGHTS BUNGALOW</text>
        <text x="42" y="116" fill="#d6d3d1" font-family="serif" font-size="10" font-style="italic">W. W. Barden &amp; Sons Begin Work on Seven-Room Residence at 1435 Heights Boulevard</text>
        <line x1="42" y1="124" x2="538" y2="124" stroke="#44403c" stroke-width="1"/>
        <text x="42" y="148" fill="#fafaf9" font-family="serif" font-size="10">Permits issued this week include a modern 1.5-story frame bungalow</text><text x="42" y="165" fill="#fafaf9" font-family="serif" font-size="10">at 1435 Heights Blvd for J. H. Miller of the Southern Pacific offices.</text><text x="42" y="182" fill="#fafaf9" font-family="serif" font-size="10">Plans prepared by Russell Brown Co. call for sleeping porch, oak floors,</text><text x="42" y="199" fill="#fafaf9" font-family="serif" font-size="10">built-in bookcases, and rear automobile house at a cost of $2,650.</text>
        

  <!-- Bottom Provenance Footer -->
  <rect x="24" y="230" width="532" height="20" rx="4" fill="#292524"/>
  <text x="32" y="244" fill="#d6d3d1" font-family="sans-serif" font-size="9.2">Newspaper building notices capture architect names &amp; interior details even before 1905 city permits existed</text>
