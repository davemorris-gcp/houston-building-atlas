<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized City of Houston HPO Historic District Inventory Survey Form">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#0f766e" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#115e59"/>
  <text x="34" y="38" fill="#ccfbf1" font-family="Georgia, serif" font-size="11" font-weight="bold">CITY OF HOUSTON HPO - HISTORIC DISTRICT INVENTORY &amp; HAHC COA</text>
  <!-- Left elevation illustration box -->
  <rect x="24" y="54" width="150" height="154" rx="4" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="99" y="70" fill="#0f766e" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SURVEY ELEVATION PHOTO</text>
  <!-- Stylized bungalow elevation -->
  <polygon points="44,122 99,84 154,122" fill="#99f6e4" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="52" y="122" width="94" height="52" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="64" y="134" width="20" height="22" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="114" y="134" width="20" height="22" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="91" y="138" width="16" height="36" fill="#0f766e"/>
  <line x1="38" y1="174" x2="160" y2="174" stroke="#0f766e" stroke-width="2"/>
  <rect x="34" y="182" width="130" height="18" rx="3" fill="#0f766e"/>
  <text x="99" y="194" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">STATUS: CONTRIBUTING (C)</text>
  <!-- Right Survey Metadata -->
  <rect x="182" y="54" width="214" height="154" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="192" y="72" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold">DISTRICT: Houston Heights East HD</text>
  <text x="192" y="90" fill="#0f172a" font-family="monospace" font-size="9.5">CIRCA YEAR BUILT: <tspan fill="#0f766e" font-weight="bold">c. 1914 (Verified)</tspan></text>
  <text x="192" y="108" fill="#0f172a" font-family="monospace" font-size="9.5">STYLE: <tspan font-weight="bold">Craftsman Bungalow</tspan></text>
  <text x="192" y="126" fill="#334155" font-family="monospace" font-size="9">ROOF: Low-Pitched Gable, Exposed Rafters</text>
  <text x="192" y="144" fill="#334155" font-family="monospace" font-size="9">CLADDING: Beveled Wood Lap Siding</text>
  <rect x="192" y="156" width="194" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="172" fill="#92400e" font-family="sans-serif" font-size="9" font-weight="bold">Ch. 33 Sec. 33-241(e) 100-Yr Gate:</text>
  <text x="200" y="188" fill="#78350f" font-family="sans-serif" font-size="8.5">Pre-1927 structures trigger HAHC review</text>
  <!-- Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#5eead4" font-family="sans-serif" font-size="9.5" text-anchor="middle">7,264 Surveyed Properties Across 22 Historic Districts + Monthly HAHC COA Tracker</text>
</svg>
