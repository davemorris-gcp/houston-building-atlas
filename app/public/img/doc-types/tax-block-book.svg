<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Harris County CR001 Tax Assessor Block Book Ledger">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#94a3b8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#1e3a8a"/>
  <text x="34" y="38" fill="#eff6ff" font-family="Georgia, serif" font-size="11" font-weight="bold">HARRIS COUNTY TAX ASSESSOR BLOCK BOOK - VOL. 18 (1915-1925)</text>
  <text x="30" y="62" fill="#1e293b" font-family="monospace" font-size="10" font-weight="bold">SUBDIVISION: HOUSTON HEIGHTS  |  BLOCK 62  |  LOT 14 (50 x 100 FT)</text>
  <!-- Ledger Table -->
  <rect x="24" y="70" width="372" height="118" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <rect x="24" y="70" width="372" height="22" fill="#e2e8f0"/>
  <line x1="78" y1="70" x2="78" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <line x1="206" y1="70" x2="206" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <line x1="292" y1="70" x2="292" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <text x="51" y="85" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">TAX YR</text>
  <text x="142" y="85" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">ASSESSED OWNER</text>
  <text x="249" y="85" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">LAND VAL</text>
  <text x="344" y="85" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">IMPRV VAL</text>
  <!-- Rows -->
  <line x1="24" y1="116" x2="396" y2="116" stroke="#cbd5e1" stroke-width="1"/>
  <text x="51" y="108" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">1912</text>
  <text x="86" y="108" fill="#475569" font-family="monospace" font-size="9.5">Omaha &amp; S. Tex. Land</text>
  <text x="249" y="108" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">$400</text>
  <text x="344" y="108" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">$0 (Vacant)</text>

  <line x1="24" y1="140" x2="396" y2="140" stroke="#cbd5e1" stroke-width="1"/>
  <text x="51" y="132" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">1913</text>
  <text x="86" y="132" fill="#475569" font-family="monospace" font-size="9.5">Carter, John H.</text>
  <text x="249" y="132" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">$450</text>
  <text x="344" y="132" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">$0 (Vacant)</text>

  <rect x="25" y="141" width="370" height="23" fill="#dcfce7"/>
  <line x1="24" y1="164" x2="396" y2="164" stroke="#cbd5e1" stroke-width="1"/>
  <text x="51" y="156" fill="#166534" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1914</text>
  <text x="86" y="156" fill="#166534" font-family="monospace" font-size="9.5" font-weight="bold">Carter, John H.</text>
  <text x="249" y="156" fill="#166534" font-family="monospace" font-size="10" text-anchor="middle">$450</text>
  <text x="344" y="156" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">$2,450 (BUILT!)</text>

  <text x="51" y="180" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">1915</text>
  <text x="86" y="180" fill="#475569" font-family="monospace" font-size="9.5">Carter, John H.</text>
  <text x="249" y="180" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">$450</text>
  <text x="344" y="180" fill="#1e293b" font-family="monospace" font-size="10" text-anchor="middle">$2,450</text>

  <text x="210" y="205" fill="#7c2d12" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Improvement Value Jump ($0 to $2,450) Proves House Was Built in 1913-1914</text>
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#93c5fd" font-family="sans-serif" font-size="9.5" text-anchor="middle">119 Volumes (1915-1997) + Microfilm Rolls (1838-1984) | Indexed by Lot &amp; Block</text>
</svg>
