<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Harris County Clerk Deed and Mechanics Lien Instrument">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#a89068" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#312e81"/>
  <text x="34" y="38" fill="#e0e7ff" font-family="Georgia, serif" font-size="11" font-weight="bold">HARRIS COUNTY CLERK - DEED &amp; MECHANIC'S LIEN INDEX (1836-2026)</text>
  <!-- Instrument Box -->
  <rect x="24" y="54" width="372" height="154" rx="4" fill="#fffdf9" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="32" y="62" width="166" height="22" rx="3" fill="#eef2ff" stroke="#818cf8" stroke-width="1"/>
  <text x="40" y="77" fill="#312e81" font-family="monospace" font-size="9.5" font-weight="bold">VOL. 312, PAGE 418 (1914)</text>
  <rect x="208" y="62" width="180" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="216" y="77" fill="#92400e" font-family="monospace" font-size="9.5" font-weight="bold">TYPE: MECHANIC'S LIEN (ML)</text>
  <text x="34" y="102" fill="#1e293b" font-family="Georgia, serif" font-size="10.5"><tspan font-weight="bold">GRANTOR (Owner):</tspan> Carter, John H. &amp; Wife Mary E. Carter</text>
  <text x="34" y="120" fill="#1e293b" font-family="Georgia, serif" font-size="10.5"><tspan font-weight="bold">GRANTEE (Builder):</tspan> W. B. Jones &amp; Sons Lumber &amp; Construction</text>
  <text x="34" y="138" fill="#0f766e" font-family="monospace" font-size="10" font-weight="bold">LEGAL DESC: Lot 14, Block 62, Houston Heights (HCAD 0201520000004)</text>
  <line x1="34" y1="147" x2="386" y2="147" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="164" fill="#334155" font-family="Georgia, serif" font-size="9.5">"For erection of one 2-story frame residence according to plans by Webber..."</text>
  <rect x="34" y="174" width="352" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="210" y="191" fill="#0f172a" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">1914 Builder Contract -> 1948 Warranty Deed -> 2021 Sec. 25.025 Unmasked</text>
  <!-- Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#c7d2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">7.68 GiB Clerk TPIA Index (1980-2026) + Pre-2004 Chain-of-Title Linker</text>
</svg>
