<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Stylized Historic Building Permit Card and Active Demolition Alert">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ec"/>
      <stop offset="100%" stop-color="#f1e8d2"/>
    </linearGradient>
    <linearGradient id="bgBlueprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f253e"/>
      <stop offset="100%" stop-color="#17375b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#091326" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="420" height="260" rx="12" fill="#0d1726"/>
  <rect x="14" y="14" width="392" height="232" rx="8" fill="url(#bgPaper)" stroke="#b45309" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="22" width="372" height="24" rx="3" fill="#0f172a"/>
  <text x="34" y="38" fill="#fef3c7" font-family="monospace" font-size="10.5" font-weight="bold">CITY OF HOUSTON BUILDING PERMIT (1905-1951 HMRC &amp; LIVE ILMS)</text>
  <!-- Historic Permit Card -->
  <rect x="24" y="52" width="224" height="156" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="32" y="70" fill="#92400e" font-family="monospace" font-size="10" font-weight="bold">PERMIT NO. 18412  |  ISSUED: APR 14, 1914</text>
  <line x1="32" y1="77" x2="240" y2="77" stroke="#fcd34d" stroke-width="1"/>
  <text x="32" y="94" fill="#1e293b" font-family="monospace" font-size="9.5">OWNER: <tspan font-weight="bold">John H. Carter</tspan></text>
  <text x="32" y="112" fill="#1e293b" font-family="monospace" font-size="9.5">ARCHITECT: <tspan fill="#0f766e" font-weight="bold">Webber &amp; Sanguinet</tspan></text>
  <text x="32" y="130" fill="#1e293b" font-family="monospace" font-size="9.5">CONTRACTOR: <tspan font-weight="bold">W. B. Jones &amp; Sons</tspan></text>
  <text x="32" y="148" fill="#1e293b" font-family="monospace" font-size="9.5">CLASS: 2-Story 7-Room Frame Residence</text>
  <text x="32" y="166" fill="#1e293b" font-family="monospace" font-size="9.5">ESTIMATED COST: <tspan font-weight="bold">$3,850.00</tspan></text>
  <text x="32" y="192" fill="#78350f" font-family="sans-serif" font-size="8.5" font-weight="bold">HMRC RG D106 Ledger -> Permit Shards</text>
  <!-- Right Live Demo / Sewer Early Warning Card -->
  <rect x="256" y="52" width="140" height="156" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="256" y="52" width="140" height="22" fill="#dc2626"/>
  <text x="326" y="67" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">8-AGENCY DEMO SWEEP</text>
  <text x="264" y="90" fill="#991b1b" font-family="monospace" font-size="9" font-weight="bold">1. Sewer Disconnect</text>
  <text x="264" y="104" fill="#7f1d1d" font-family="sans-serif" font-size="8.5">Filed before demo permit</text>
  <text x="264" y="124" fill="#991b1b" font-family="monospace" font-size="9" font-weight="bold">2. ILMS Demo Permit</text>
  <text x="264" y="138" fill="#7f1d1d" font-family="sans-serif" font-size="8.5">Daily 7:00 AM CT Poll</text>
  <rect x="264" y="152" width="124" height="46" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1"/>
  <text x="326" y="169" fill="#be123c" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Two-Key Safety Gate:</text>
  <text x="326" y="182" fill="#881337" font-family="sans-serif" font-size="8" text-anchor="middle">Requires visual confirmation</text>
  <text x="326" y="193" fill="#881337" font-family="sans-serif" font-size="8" text-anchor="middle">before Lost Houston graduation</text>
  <!-- Footer -->
  <rect x="24" y="216" width="372" height="22" rx="4" fill="#1e293b"/>
  <text x="210" y="230" fill="#fde68a" font-family="sans-serif" font-size="9.5" text-anchor="middle">1.21M Parcel Permit Shards + Daily Structural Demo &amp; Sewer Disconnect Alerts</text>
</svg>
