name: Deploy Houston Building Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_verify:
        description: "Skip verify job when re-deploying an already-verified commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Pre-Deploy Stratified Verification (Layer 1 Unit + Layer 2 45-Archetype E2E)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_verify) }}
    concurrency:
      group: "pages-verify-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Generate & verify 45 Stratified Property Archetypes
        run: node scripts/build_test_archetypes.mjs

      - name: Run Layer 1 Unit, Schema, Bundle Size & URL-Pattern Suite
        run: node tests/unit/run_all.mjs

      - name: Set up Playwright Headless Chromium
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run Layer 1B Python Pipeline Unit Suite
        working-directory: pipeline
        run: |
          uv sync --dev
          uv run --no-sync pytest tests -v

      - name: Run Layer 2 Playwright E2E Suite (Global Controls + 45 Stratified Archetypes)
        working-directory: pipeline
        run: uv run --no-sync pytest ../tests/e2e -n auto -v

      - name: Upload Harvested External URLs & Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e2e-verification-results
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy Verified Site to GitHub Pages
    needs: verify
    if: always() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_verify)) && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: "pages-deploy-${{ github.ref }}"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site + PMTiles v3 shards artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: "app"

      - name: Extend deploy-pages client timeout ceiling for 561MB bundle
        run: |
          if [ -f /home/runner/work/_actions/actions/deploy-pages/v4/dist/index.js ]; then
            sed -i 's/MAX_TIMEOUT = 600000/MAX_TIMEOUT = 1800000/g' /home/runner/work/_actions/actions/deploy-pages/v4/dist/index.js
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
