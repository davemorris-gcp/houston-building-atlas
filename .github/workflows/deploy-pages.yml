name: Deploy Houston Building Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-Deploy Stratified Verification (Layer 1 Unit + Layer 2 45-Archetype E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Generate & verify 45 Stratified Property Archetypes
        run: node scripts/build_test_archetypes.mjs

      - name: Run Layer 1 Unit, Schema, Bundle Size & URL-Pattern Suite
        run: node tests/unit/run_all.mjs

      - name: Set up Playwright Headless Chromium
        uses: ./.github/actions/setup-playwright-e2e

      - name: Run Layer 2 Playwright E2E Suite (Global Controls + 45 Stratified Archetypes)
        working-directory: pipeline
        run: uv run --no-sync pytest ../tests/e2e -n auto -v

      - name: Upload Harvested External URLs & Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-e2e-verification-results
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy Verified Site to GitHub Pages
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site + PMTiles v3 shards artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "app"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
